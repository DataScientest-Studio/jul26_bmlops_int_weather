# ingestion and preprocess are jobs: they run once and stop. the api stays up.
# there is no training job here: training happens only when someone calls POST /train.

services:
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    image: weather-ingestion:latest
    container_name: weather_ingestion
    networks:
      - weather_network
    volumes:
      - ./data:/app/data

  preprocess:
    build:
      context: .
      dockerfile: docker/preprocess/Dockerfile
    image: weather-preprocess:latest
    container_name: weather_preprocess
    networks:
      - weather_network
    volumes:
      # read and write, this job writes the train/validation/test splits
      - ./data:/app/data
    depends_on:
      ingestion:
        # only start if the previous container exited with code 0
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: weather-api:latest
    container_name: weather_api
    networks:
      - weather_network
    ports:
      - "8000:8000"
    volumes:
      # read only, the api must not change the dataset
      - ./data:/app/data:ro
      # read and write, the /train endpoint saves a new model
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      preprocess:
        condition: service_completed_successfully
    healthcheck:
      # calls our own /health endpoint
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  weather_network:
