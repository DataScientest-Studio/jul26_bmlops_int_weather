name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -m "not gateway"

  # builds the three images so a broken Dockerfile is caught here, not on a laptop
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the images
        run: docker compose --profile gateway --profile streamlit --profile test --profile mlflow build

      - name: Run lint, unit tests, and live nginx checks
        env:
          API_AUTH_USER: ci
          API_AUTH_PASSWORD: ci
        run: |
          docker compose up -d --build --no-deps api
          docker compose --profile gateway up -d --build --no-deps nginx
          docker compose --profile test run --rm -e GATEWAY_URL=https://nginx test
