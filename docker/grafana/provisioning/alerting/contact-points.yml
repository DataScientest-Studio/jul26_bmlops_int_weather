apiVersion: 1
contactPoints:
  - orgId: 1
    name: airflow-retrain
    receivers:
      - uid: airflow-retrain
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://airflow-webserver:8080/api/v1/dags/weather_pipeline/dagRuns
          httpMethod: POST
          username: $AIRFLOW_API_USER
          password: $AIRFLOW_API_PASSWORD
          payload:
            template: '{"conf": {"triggered_by": "grafana"}}'
