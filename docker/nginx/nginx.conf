worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    # Per-IP limits for the public prediction API and the heavier /train route.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=train:10m rate=1r/s;

    # Add extra `server api-N:8000;` lines here if the API is scaled out.
    upstream api_upstream {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-XSS-Protection "0" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        location /health {
            proxy_pass http://api_upstream;
        }

        location /docs {
            limit_req zone=api burst=20 nodelay;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;
            proxy_pass http://api_upstream;
        }

        location /redoc {
            limit_req zone=api burst=20 nodelay;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; frame-ancestors 'none'" always;
            proxy_pass http://api_upstream;
        }

        location /openapi.json {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_upstream;
        }

        location /train {
            limit_req zone=train burst=3 nodelay;
            proxy_pass http://api_upstream;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_upstream;
        }

        location /metrics {
            return 404;
        }
    }
}
